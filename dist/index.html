<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wup Web accounts</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f1f5f3;
      --button: #fff;
      --border: #a6bdb4;
      --ink: #15382d;
      --active: #005b43;
      --active-ink: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #132621;
        --button: #203930;
        --border: #4c7264;
        --ink: #e0f2ea;
        --active: #9de9cf;
        --active-ink: #123629;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      font: 600 13px "Segoe UI", sans-serif;
    }
    nav, form, .notice {
      height: 50px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
    }
    [hidden] { display: none !important; }
    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--button);
      color: var(--ink);
      font: inherit;
      white-space: nowrap;
      cursor: pointer;
    }
    button:hover { border-color: var(--active); }
    button:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
    button[aria-pressed="true"] {
      border-color: var(--active);
      background: var(--active);
      color: var(--active-ink);
    }
    .account-list {
      display: flex;
      align-items: center;
      gap: inherit;
      min-width: 0;
      padding: 3px;
      margin-inline: -3px;
      overflow-x: auto;
      scrollbar-width: thin;
    }
    .account {
      flex: none;
      max-width: 100%;
      min-height: 30px;
      border-radius: 999px;
    }
    .account-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .avatar { flex: none; width: 20px; height: 20px; border-radius: 50%; }
    #edit { flex: none; }
    form input {
      flex: 1;
      min-width: 0;
      height: 32px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--button);
      color: var(--ink);
      font: inherit;
    }
    .badge {
      flex: none;
      min-width: 1.5em;
      max-width: 5em;
      padding: 2px 4px;
      overflow: hidden;
      border-radius: 999px;
      background: #00422e;
      color: #fff4b5;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: center;
      text-overflow: ellipsis;
    }
    #status { flex: 1; font-size: 12px; }
    @media (max-width: 540px) {
      .account-name[data-default] { font-size: 0; }
      .account-name[data-default]::after {
        content: attr(data-default);
        font-size: 13px;
      }
    }
    @media (max-width: 365px) {
      nav, form, .notice { padding: 0 6px; gap: 4px; }
      button { padding: 0 6px; }
    }
  </style>
</head>
<body>
  <nav id="accounts" aria-label="WhatsApp accounts">
    <div id="account-list" class="account-list"></div>
    <button id="edit" type="button">Edit</button>
  </nav>
  <form id="settings" aria-label="Edit selected account" hidden>
    <input id="name" aria-label="Account name" placeholder="Account name" autocomplete="off">
    <button type="submit">Save</button>
    <button id="photo" type="button" title="Sync your WhatsApp profile photo">Sync photo</button>
    <button id="reset" type="button" title="Restore the default icon">Reset icon</button>
    <button id="back" type="button">Back</button>
  </form>
  <div class="notice" hidden>
    <span id="status" role="status"></span>
    <button id="dismiss" type="button">OK</button>
  </div>
  <template id="account-template">
    <button class="account" type="button" aria-pressed="false">
      <canvas class="avatar" width="48" height="48" aria-hidden="true" hidden></canvas>
      <span class="account-name"></span>
      <span class="badge" aria-hidden="true" hidden></span>
    </button>
  </template>
  <script>
    const nav = document.getElementById('accounts');
    const accountList = document.getElementById('account-list');
    const edit = document.getElementById('edit');
    const form = document.getElementById('settings');
    const nameInput = document.getElementById('name');
    const photo = document.getElementById('photo');
    const reset = document.getElementById('reset');
    const status = document.getElementById('status');
    const notice = status.parentElement;
    const dismiss = document.getElementById('dismiss');
    const template = document.getElementById('account-template');
    const buttons = Array.from({ length: 4 }, () => {
      const button = template.content.firstElementChild.cloneNode(true);
      accountList.append(button);
      return button;
    });
    const invoke = (command, args) => window.__TAURI_INTERNALS__.invoke(command, args);
    let selected = 0;
    let preferences = [];
    let editing = null;
    let busy = false;

    window.showAccounts = (index, counts, accounts) => {
      selected = index;
      preferences = accounts;
      buttons.forEach((button, index) => {
        const badge = button.querySelector('.badge');
        const accountName = button.querySelector('.account-name');
        const avatar = button.querySelector('.avatar');
        const { label, name, avatar: pixels } = accounts[index];
        const count = counts[index];
        const description = count > 0 ? `${label}, ${count} unread` : label;
        button.setAttribute('aria-pressed', String(index === selected));
        button.setAttribute('aria-label', description);
        button.title = description;
        accountName.textContent = label;
        if (name === null) accountName.dataset.default = index + 1;
        else delete accountName.dataset.default;
        avatar.hidden = !pixels;
        if (pixels && avatar.dataset.pixels !== pixels) {
          const context = avatar.getContext('2d');
          const image = context.createImageData(avatar.width, avatar.height);
          for (let i = 0; i < image.data.length; i++) {
            image.data[i] = Number.parseInt(pixels.slice(i * 2, i * 2 + 2), 16);
          }
          context.putImageData(image, 0, 0);
          avatar.dataset.pixels = pixels;
        }
        badge.hidden = !(count > 0);
        badge.textContent = count > 0 ? String(count) : '';
      });
      edit.setAttribute('aria-label', `Edit ${accounts[selected].label}`);
      if (editing !== null) {
        reset.hidden = !accounts[editing].avatar;
        photo.disabled = editing !== selected;
      }
    };

    function showNotice(message, pending = false) {
      nav.hidden = form.hidden = true;
      notice.hidden = false;
      dismiss.hidden = pending;
      status.textContent = message;
      if (!pending) dismiss.focus();
    }

    function returnToAccounts() {
      editing = null;
      notice.hidden = form.hidden = true;
      nav.hidden = false;
    }

    window.switchFailed = () => showNotice('Could not switch accounts.');
    window.showAccounts(0, [], buttons.map((_, index) => ({
      label: `Account ${index + 1}`, name: null, avatar: null
    })));

    edit.onclick = () => {
      editing = selected;
      const account = preferences[editing];
      nameInput.value = account.name ?? '';
      nameInput.placeholder = `Account ${editing + 1}`;
      form.setAttribute('aria-label', `Edit ${account.label}`);
      reset.hidden = !account.avatar;
      photo.disabled = false;
      nav.hidden = true;
      form.hidden = false;
      nameInput.focus();
    };
    document.getElementById('back').onclick = dismiss.onclick = () => {
      returnToAccounts();
      edit.focus();
    };

    async function update(action, value, message) {
      if (busy || editing === null) return;
      busy = true;
      showNotice(message, true);
      let timeout;
      try {
        const request = invoke('edit_account', { index: editing, action, name: value });
        if (action === 'sync_icon') {
          await Promise.race([request, new Promise((_, reject) => {
            timeout = setTimeout(() => reject('Photo selection timed out. Open your profile and try again.'), 30000);
          })]);
        } else {
          await request;
        }
      } catch (error) {
        showNotice(typeof error === 'string' ? error : 'Could not update account settings.');
        return;
      } finally {
        clearTimeout(timeout);
        busy = false;
      }
      returnToAccounts();
      edit.focus();
    }

    form.onsubmit = event => {
      event.preventDefault();
      update('rename', nameInput.value, 'Saving account name…');
    };
    photo.onclick = () => update('sync_icon', null, 'Click your photo in your WhatsApp profile.');
    reset.onclick = () => update('reset_icon', null, 'Restoring default icon…');

    buttons.forEach((button, index) => {
      button.addEventListener('click', async () => {
        try {
          await invoke('select_account', { index });
        } catch {
          window.switchFailed();
        }
      });
    });
  </script>
</body>
</html>
