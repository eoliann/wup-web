[package]
name = "wup-web"
version = "2.1.1"
description = "WhatsApp Web Client"
license = "MIT"
homepage = "https://github.com/eoliann/wup-web"
repository = "https://github.com/eoliann/wup-web"
bugs = "https://github.com/eoliann/wup-web/issues"
authors = ["eOL"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.9.1", features = ["tray-icon", "unstable"] }
semver = "1"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
windows-core = "0.61"
winreg = "0.10"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
